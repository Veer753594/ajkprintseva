<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Dashboard — Ayush Janseva Kendra</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><div class="brand-mark">AJ</div><div><strong>Ayush Janseva Kendra</strong><span>Customer Dashboard</span></div></div><div class="header-actions"><span id="userLabel"></span><button onclick="logout()">Logout</button></div></header>
<main class="wrap"><section class="hero dashboard-hero"><div><span class="eyebrow">CUSTOMER PORTAL</span><h1>Upload Files for Printing</h1><p>Send your documents or photos to the service desk. The admin will finalize paper type and start printing.</p></div><div class="hero-badge">PRINT<br><b>ORDER</b></div></section>
<section class="card"><form id="orderForm" enctype="multipart/form-data"><div class="section-title"><h2>New Print Order</h2><span>Step 1 of 1</span></div><div class="grid2"><label>Customer Name<input name="name" required placeholder="Your name"></label><label>Mobile Number<input name="phone" inputmode="numeric" placeholder="Mobile number"></label></div><label>Files to Print<input id="files" type="file" name="files" multiple required></label><div id="fileList" class="filelist"></div><div class="grid3"><label>Color / B&amp;W<select name="color"><option>Color</option><option>Black &amp; White</option></select></label><label>Copies<input type="number" name="copies" min="1" value="1"></label><label>Side<select name="side"><option>Single Side</option><option>Double Side</option></select></label></div><button class="primary" type="submit">Submit Print Order →</button><div id="result"></div></form></section>
<section class="card"><div class="section-title"><h2>My Recent Orders</h2><button class="secondary" onclick="loadOrders()">Refresh</button></div><div id="myOrders"></div></section></main><script src="customer.js"></script></body></html>
